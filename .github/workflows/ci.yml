name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Run deterministic demo
        run: python -m sightings_analysis demo --output smoke-output

  portability-smoke:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Check CLI
        run: python -m sightings_analysis --help
      - name: Create template
        run: python -m sightings_analysis template --output smoke-template.csv
      - name: Run demo
        run: python -m sightings_analysis demo --output smoke-output

  installed-wheel-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Build wheel
        run: python -m pip wheel . --no-deps --no-build-isolation --wheel-dir wheelhouse
      - name: Create clean environment and install wheel
        run: |
          python -m venv wheel-smoke-env
          wheel-smoke-env/bin/python -m pip install wheelhouse/*.whl
      - name: Run installed package outside the repository
        run: |
          mkdir -p "$RUNNER_TEMP/ufo-wheel-smoke"
          cd "$RUNNER_TEMP/ufo-wheel-smoke"
          "$GITHUB_WORKSPACE/wheel-smoke-env/bin/python" -m sightings_analysis --help
          "$GITHUB_WORKSPACE/wheel-smoke-env/bin/python" -m sightings_analysis demo --output demo-output
          test -f demo-output/analysis-summary.md
          test -f demo-output/input/synthetic-reports.csv
