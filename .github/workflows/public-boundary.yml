name: Public Boundary

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Scan release tree
        run: python -m sightings_analysis privacy-scan .
      - name: Verify release manifest
        run: python -m sightings_analysis verify-release
