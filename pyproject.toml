[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ufo-uap-sightings-analysis"
version = "1.0.0"
description = "A reproducible Python pipeline for validating and statistically analyzing reported UFO/UAP sighting datasets."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["uap", "ufo", "data-analysis", "statistics", "data-quality", "research-methods"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = []

[project.scripts]
sightings-analysis = "sightings_analysis.cli:main"

[tool.setuptools]
packages = ["sightings_analysis"]
