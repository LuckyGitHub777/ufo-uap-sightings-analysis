<text x="211.50" y="498" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#30444e">Morning</text>
<rect x="333.00" y="255.26" width="175.00" height="214.74" rx="3" fill="#145f73"/>
<text x="420.50" y="247.26" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#10242d">1228</text>
<text x="420.50" y="498" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#30444e">Afternoon</text>
<rect x="542.00" y="138.80" width="175.00" height="331.20" rx="3" fill="#145f73"/>
<text x="629.50" y="130.80" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#10242d">1894</text>
<text x="629.50" y="498" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#30444e">Evening</text>
