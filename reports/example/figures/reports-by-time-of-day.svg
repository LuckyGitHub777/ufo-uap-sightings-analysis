<text x="838.50" y="306.89" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#10242d">887</text>
<text x="838.50" y="498" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#30444e">Night</text>
<text x="90" y="536" font-family="Arial, sans-serif" font-size="13" fill="#667780">Synthetic demonstration • descriptive counts only • Morning 06:00-11:59, Afternoon 12:00-17:59, Evening 18:00-21:59, Night 22:00-05:59 (unequal spans)</text>
