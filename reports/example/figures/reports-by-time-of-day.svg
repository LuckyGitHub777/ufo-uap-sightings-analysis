<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<title id="title">Reported Sightings by Time of Day</title>
<desc id="desc">Bar chart of reported sighting counts by morning, afternoon, evening, and night for the synthetic demonstration. Categories: Morning 06:00-11:59, Afternoon 12:00-17:59, Evening 18:00-21:59, Night 22:00-05:59 (unequal spans).</desc>
<rect width="100%" height="100%" fill="#fbfcfd"/>
